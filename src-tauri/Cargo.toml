[package]
name = "r-cloud"
version = "1.0.0"
description = "R Cloud - Desktop & Mobile App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "r_cloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
