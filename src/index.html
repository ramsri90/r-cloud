<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R Cloud - Unlimited Cloud Storage</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#65de69">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="R Cloud">
    <link rel="apple-touch-icon" href="/assets/unlim-clear.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a2c20 0%, #0d120e 50%, #080b09 100%);
            --accent: #65de69;
            --accent-hover: #52c856;
            --accent-glow: rgba(101, 222, 105, 0.25);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f4f1;
            --text-muted: #94a396;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            margin-bottom: 24px;
            position: relative;
            display: inline-block;
        }

        .logo-wrapper img {
            max-width: 140px;
            height: auto;
            filter: drop-shadow(0 0 20px var(--accent-glow));
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px var(--accent-glow)); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 30px rgba(101, 222, 105, 0.4)); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a5d8ad 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #080b09;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(101, 222, 105, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(255, 74, 74, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 74, 74, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 74, 74, 0.2);
            border-color: rgba(255, 74, 74, 0.5);
            transform: translateY(-2px);
        }

        .pwa-banner {
            background: rgba(101, 222, 105, 0.06);
            border: 1px dashed rgba(101, 222, 105, 0.3);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }

        .pwa-banner h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pwa-banner p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .footer-info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .version-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <img src="/assets/unlim-clear.png" alt="R Cloud Logo">
        </div>

        <h1>R Cloud</h1>
        <p class="subtitle">Your unlimited cloud storage companion, powered by Telegram.</p>

        <div class="actions">
            <a href="https://unlim-cloud.web.app" class="btn btn-primary" id="launchBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Launch R Cloud Web
            </a>
            <a href="https://github.com/ramsri90/r-cloud/releases/latest" target="_blank" class="btn btn-secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download Desktop App
            </a>
            <button class="btn btn-danger" id="logoutBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout / Reset Session
            </button>
        </div>

        <div class="pwa-banner">
            <h3>📱 Install on Android / iOS</h3>
            <p>Tap your browser menu <strong>(⋮)</strong> and select <strong>"Add to Home Screen"</strong> or <strong>"Install App"</strong> to use R Cloud as a mobile app!</p>
        </div>

        <div class="footer-info">
            <span class="version-badge">v2.0.0</span>
        </div>
    </div>

    <script>
        // Automatic redirection ONLY when running inside Tauri Desktop app
        if (window.__TAURI_INTERNALS__ || window.__TAURI__) {
            window.location.href = "https://unlim-cloud.web.app";
        }

        // Logout & Session Reset handler
        document.getElementById("logoutBtn").addEventListener("click", () => {
            if (confirm("Logout of R Cloud and reset saved session?")) {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                    if (indexedDB && indexedDB.databases) {
                        indexedDB.databases().then(dbs => {
                            dbs.forEach(db => indexedDB.deleteDatabase(db.name));
                        });
                    }
                } catch (e) {
                    console.warn("Storage clear notice:", e);
                }
                // Redirect to fresh login
                window.location.href = "https://unlim-cloud.web.app";
            }
        });
    </script>
</body>
</html>
